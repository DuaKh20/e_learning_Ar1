<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رحلة القائد الذكي</title>

<style>
:root{
  --bg:#07142b; --bg2:#0d2147; --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12);
  --text:#eef3fb; --muted:#9fb1cf; --gold:#e8b94a; --gold2:#f6d77e; --teal:#2dd4bf;
  --good:#34d399; --mid:#fbbf24; --bad:#f87171; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  color:var(--text);min-height:100vh;line-height:1.8;direction:rtl;text-align:right;
  background:radial-gradient(1200px 600px at 85% -10%,#15357a55,transparent),
             radial-gradient(900px 500px at 0% 100%,#0e7c7b33,transparent),
             linear-gradient(160deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a2540;box-shadow:0 6px 18px #e8b94a44}
.ghost{background:var(--card);border:1px solid var(--card-b);padding:8px 14px;border-radius:12px;font-size:.9rem;transition:.2s}
.ghost:hover{background:#ffffff1f;transform:translateY(-1px)}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);padding:24px;
  box-shadow:0 10px 30px #00000040;backdrop-filter:blur(8px);animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.3;font-weight:800;
  background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.4rem;font-weight:800;margin-bottom:8px}
h3{font-size:1.1rem;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:1.1rem;margin:10px 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:14px;font-weight:700;font-size:1.05rem;

.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px #e8b94a60}
.btn.alt{background:linear-gradient(135deg,#14b8a6,var(--teal));box-shadow:0 8px 22px #2dd4bf33}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.obj{background:#ffffff0a;border:1px solid var(--card-b);border-radius:14px;padding:16px}
.obj .ic{font-size:1.6rem}
.hero{text-align:center;padding:40px 22px}
.hero .big{font-size:3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:#ffffff0a;border:1px solid var(--card-b);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--gold2)}
.stat span{color:var(--muted);font-size:.9rem}
.bar{height:12px;border-radius:99px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .7s ease}
.sc-list{display:grid;gap:14px;margin-top:16px}
.sc{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sc .l{display:flex;gap:14px;align-items:center;flex:1;min-width:240px}
.sc .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:#ffffff12;flex:none}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:#2dd4bf22;color:var(--teal);border:1px solid #2dd4bf55}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:700}
.chip.good{background:#34d39922;color:var(--good)} .chip.mid{background:#fbbf2422;color:var(--mid)} .chip.bad{background:#f8717122;color:var(--bad)}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.badge{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid var(--card-b);background:#ffffff0a;font-size:.92rem}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge.on{border-color:var(--gold);background:#e8b94a1f}
.situ{border-right:4px solid var(--gold);background:#ffffff0a;border-radius:12px;padding:16px 18px;margin:12px 0 18px;font-size:1.08rem}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;padding:16px;border-radius:14px;
  background:#ffffff0d;border:1.5px solid var(--card-b);font-size:1.02rem;transition:.2s;line-height:1.8}
.opt:hover:not(:disabled){border-color:var(--teal);background:#2dd4bf14;transform:translateX(-4px)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#ffffff1a}
.opt:disabled{cursor:default;opacity:.5}
.opt.chosen{opacity:1;border-color:var(--gold);background:#e8b94a1c}
.fb{margin-top:18px;border-radius:14px;padding:18px;border:1px solid var(--card-b);background:#ffffff0a;animation:rise .4s ease both}
.fb.good{border-color:#34d39977} .fb.mid{border-color:#fbbf2477} .fb.bad{border-color:#f8717177}
.fb p{margin:6px 0}
.fb .lbl{color:var(--gold2);font-weight:700}
.steps{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:6px;flex-wrap:wrap;justify-content:space-between}
.ring{--p:0;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff1a 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#0b1c3d;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring b{font-size:2.2rem;color:var(--gold2)} .ring small{color:var(--muted)}
.lvl{font-size:1.8rem;font-weight:800;text-align:center}
.res-row{display:grid;grid-template-columns:1.2fr 2fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff14}
.res-row:last-child{border:none}
ul.clean{list-style:none;display:grid;gap:8px}
ul.clean li{padding:10px 14px;background:#ffffff0a;border-radius:10px;border-right:3px solid var(--teal)}
ul.imp li{border-right-color:var(--mid)}
ol.recs{padding-right:22px;display:grid;gap:10px} ol.recs li::marker{color:var(--gold);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mt{margin-top:16px}
@media(max-width:720px){
  .grid3,.stats{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .res-row{grid-template-columns:1fr}
  .card{padding:18px}
  .btn{width:100%;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const MAX_PER_SC=20, MAX_TOTAL=60;
const LEVELS=[

   desc:'أظهرت نضجًا قياديًا عاليًا: استمعت قبل أن تحكم، وتعاملت بشفافية وحياد، واتخذت قرارات مدروسة تحت الضغط.',
   recs:['شارك خبرتك عبر توجيه قادة جدد داخل مؤسستك (Mentoring).','وثّق ممارساتك القيادية الناجحة كنماذج يستفيد منها فريقك.','طوّر مهارات القيادة الاستراتيجية وإدارة التغيير للانتقال إلى مستوى أعلى.']},
  {min:30,name:'قائد واعد',icon:'🌟',color:'var(--gold)',
   desc:'تمتلك أسسًا قيادية جيدة وتتخذ قرارات فعّالة في كثير من المواقف، مع فرص واضحة لصقل أسلوبك في مواقف محددة.',
   recs:['راجع القرارات التي حصلت فيها على نقاط أقل وفكّر في البدائل الأنسب.','اطلب تغذية راجعة منتظمة من فريقك ومديرك حول أسلوبك القيادي.','تدرّب على سيناريوهات إضافية لتحويل المعرفة إلى عادة قيادية.']},
  {min:0,name:'قائد يحتاج إلى تطوير',icon:'🌱',color:'var(--mid)',
   desc:'أظهرت النتائج أن بعض قراراتك قد تضر بالثقة أو الأداء. هذه فرصة قيمة للتعلم، ويمكنك تحسين نتائجك بسرعة بالممارسة.',
   recs:['خصّص وقتًا للاستماع الفعّال للفريق قبل اتخاذ أي قرار يمسّهم.','التحق ببرنامج تدريبي في مهارات التواصل وإدارة الخلافات.','أعد الرحلة واختبر مسارات مختلفة لترى كيف تتغير النتائج بتغير القرار.']}

const BADGES=[
  {id:'b1',icon:'👂',name:'المُصغي الواعي',desc:'٥٠٪+ في سيناريو الأداء',test:c=>c.s[0]>=15},
  {id:'b2',icon:'🌉',name:'صانع الجسور',desc:'تفوق في حل النزاعات',test:c=>c.s[1]>=15},
  {id:'b3',icon:'🧊',name:'هادئ تحت الضغط',desc:'تفوق في القرار تحت الضغط',test:c=>c.s[2]>=15},
  {id:'b4',icon:'🧭',name:'مكتمل الرحلة',desc:'إنجاز السيناريوهات الثلاثة',test:c=>c.all},
  {id:'b5',icon:'💎',name:'الدرجة الكاملة',desc:'٦٠ من ٦٠ نقطة',test:c=>c.all&&c.t===MAX_TOTAL}
];

/* ---------- الحالة والحفظ ---------- */
const KEY='smart-leader-journey-v1';
const fresh=()=>({v:1,view:'welcome',si:0,node:'a',hist:[[],[],[]],done:[false,false,false],pending:false});
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.v===1&&Array.isArray(r.hist)&&r.hist.length===3)return r;
  }catch(e){}
  return fresh();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- حسابات ---------- */
const scoreOf=i=>S.hist[i].reduce((a,h)=>a+SC[i].nodes[h.n].opts[h.o].s,0);
const ctx=()=>{const s=SC.map((_,i)=>scoreOf(i));return{s,t:s.reduce((a,b)=>a+b,0),all:S.done.every(Boolean)}};
const levelOf=t=>LEVELS.find(l=>t>=l.min);
const ar=n=>Number(n).toLocaleString('ar-EG');
const quality=s=>s>=10?['good','قرار فعّال']:s>=5?['mid','قرار مقبول']:['bad','قرار غير فعّال'];
const doneCount=()=>S.done.filter(Boolean).length;
const LET=['أ','ب','ج'];

/* ---------- العرض ---------- */
const app=document.getElementById('app');

function vWelcome(){
  const started=S.hist.some(h=>h.length);
  return `<section class="card hero">
    <div class="big">🧭</div>
    <h1>رحلة القائد الذكي</h1>
    <p class="sub">اختبر قراراتك، طوّر مهاراتك، واكتشف أسلوبك القيادي</p>
    <p style="max-width:640px;margin:0 auto 22px;color:var(--muted)">
      محاكاة تفاعلية من ثلاثة مواقف عملية واقعية. كل قرار تتخذه يقودك إلى نتائج مختلفة، وتتلقى بعده تغذية راجعة تساعدك على فهم أثر قراراتك القيادية.</p>
    <div class="grid3" style="text-align:right;margin-bottom:26px">
      <div class="obj"><div class="ic">💬</div><h3>التواصل والتوجيه</h3><p style="color:var(--muted)">تعلّم الحوار البنّاء مع الموظفين ومعالجة تراجع الأداء.</p></div>
      <div class="obj"><div class="ic">⚖️</div><h3>حل النزاعات</h3><p style="color:var(--muted)">أدِر الخلافات داخل الفريق بحياد وحوّلها إلى فرص للتعاون.</p></div>
      <div class="obj"><div class="ic">🎯</div><h3>القرار تحت الضغط</h3><p style="color:var(--muted)">اتخذ قرارات واثقة وتواصل بشفافية مع الإدارة العليا.</p></div>
    </div>
    <button class="btn" data-act="start">${started?'متابعة الرحلة':'ابدأ الرحلة'} ◀</button>
  </section>`;
}

function badgesHTML(){
  const c=ctx();
  return `<div class="badges">${BADGES.map(b=>{const on=b.test(c);
    return `<div class="badge ${on?'on':'off'}" title="${b.desc}"><span>${b.icon}</span><span>${b.name}</span></div>`}).join('')}</div>`;
}

function vDash(){
  const c=ctx(), d=doneCount(), pct=Math.round(d/3*100);
  const cards=SC.map((sc,i)=>{
    const done=S.done[i];
    return `<div class="card sc">
      <div class="l"><div class="ico">${sc.icon}</div>
        <div><span class="tag">التحدي ${ar(i+1)} · ${sc.skill}</span>
        <h3 style="margin-top:6px">${sc.title}</h3>
        <p style="color:var(--muted);font-size:.95rem">${sc.intro}</p></div></div>
      ${done
        ?`<div style="text-align:center"><span class="chip good">✔ مكتمل</span><div style="margin-top:4px;color:var(--gold2);font-weight:700">${ar(c.s[i])} / ${ar(MAX_PER_SC)}</div></div>`
        :`<button class="btn alt" data-act="open" data-i="${i}">ابدأ التحدي ◀</button>`}
    </div>`}).join('');
  return `<section>
    <div class="card">
      <h2>لوحة التقدم</h2>
      <div class="stats">
        <div class="stat"><b>${ar(c.t)}</b><span>مجموع النقاط (من ${ar(MAX_TOTAL)})</span></div>
        <div class="stat"><b>${ar(d)}</b><span>تحديات مكتملة</span></div>
        <div class="stat"><b>${ar(3-d)}</b><span>تحديات متبقية</span></div>
      </div>
      <div class="steps"><span>نسبة الإنجاز</span><b>${ar(pct)}٪</b></div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <h3 class="mt">الأوسمة</h3>${badgesHTML()}
    </div>
    <div class="sc-list">${cards}</div>
    ${c.all?`<div class="mt" style="text-align:center"><button class="btn" data-act="results">عرض النتيجة النهائية ◀</button></div>`:''}
  </section>`;
}

function vPlay(){
  const sc=SC[S.si], node=sc.nodes[S.node], step=S.hist[S.si].length+(S.pending?0:1);
  const stepNo=S.pending?S.hist[S.si].length:step;
  let chosen=-1, last=null;
  if(S.pending){last=S.hist[S.si][S.hist[S.si].length-1];chosen=last.o}
  const opts=node.opts.map((op,i)=>`
    <button class="opt ${chosen===i?'chosen':''}" data-act="choose" data-i="${i}" ${S.pending?'disabled':''}>
      <span class="k">${LET[i]}</span><span>${op.t}</span></button>`).join('');
  let fb='';
  if(S.pending){
    const op=node.opts[chosen], [q,ql]=quality(op.s), isEnd=!op.n;
    const lastDone=isEnd&&doneCount()===3;
    fb=`<div class="fb ${q}">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="chip ${q}">${ql}</span><b style="color:var(--gold2)">+${ar(op.s)} نقطة</b></div>
      <p><span class="lbl">النتيجة المباشرة: </span>${op.c}</p>
      <p><span class="lbl">لماذا؟ </span>${op.f}</p>
      ${isEnd?`<p class="mt"><span class="lbl">حصيلتك في هذا التحدي: </span>${ar(scoreOf(S.si))} من ${ar(MAX_PER_SC)} — المهارة: ${sc.skill}</p>`:''}
      <div class="mt"><button class="btn" data-act="next">${isEnd?(lastDone?'عرض النتيجة النهائية ◀':'العودة إلى لوحة التقدم ◀'):'متابعة المسار ◀'}</button></div>
    </div>`;
  }
  return `<section class="card">
    <div class="steps"><span>${sc.icon} التحدي ${ar(S.si+1)}: ${sc.title}</span><span>القرار ${ar(S.pending?stepNo:step)} من ${ar(2)}</span></div>
    <div class="bar"><i style="width:${Math.round(((S.pending?stepNo:step-1)/2)*100)}%"></i></div>
    <div class="situ">${node.text}</div>
    <div class="opts">${opts}</div>${fb}
  </section>`;
}

function vResults(){
  const c=ctx(), lv=levelOf(c.t), pct=Math.round(c.t/MAX_TOTAL*100);
  const strengths=SC.filter((_,i)=>c.s[i]>=15).map(s=>s.strength);
  const improves=SC.filter((_,i)=>c.s[i]<15).map(s=>s.improve);
  const weak=SC.map((s,i)=>({s,sc:c.s[i]})).filter(x=>x.sc<15).sort((a,b)=>a.sc-b.sc).map(x=>x.s.rec);
  const recs=[...weak,...lv.recs].slice(0,3);
  const rows=SC.map((sc,i)=>{const [q,ql]=quality(c.s[i]/2);
    return `<div class="res-row"><div><b>${sc.icon} ${sc.title}</b><div style="color:var(--muted);font-size:.85rem">${sc.skill}</div></div>
      <div class="bar"><i style="width:${Math.round(c.s[i]/MAX_PER_SC*100)}%"></i></div>
      <div style="white-space:nowrap"><b style="color:var(--gold2)">${ar(c.s[i])}/${ar(MAX_PER_SC)}</b> <span class="chip ${q}">${ql.replace('قرار','أداء')}</span></div></div>`}).join('');
  return `<section>
    <div class="card" style="text-align:center">
      <div class="ring" style="--p:${pct}"><div><span><b>${ar(c.t)}</b><br><small>من ${ar(MAX_TOTAL)}</small></span></div></div>
      <div class="lvl" style="color:${lv.color}">${lv.icon} ${lv.name}</div>
      <p style="color:var(--muted);max-width:620px;margin:8px auto 0">${lv.desc}</p>
    </div>
    <div class="card mt"><h2>نتائج السيناريوهات</h2>${rows}</div>
    <div class="two">
      <div class="card"><h3>✅ نقاط القوة</h3><ul class="clean">${(strengths.length?strengths:['أبديت استعدادًا لخوض التجربة والتعلم من نتائج قراراتك.']).map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><h3>🔧 مجالات التطوير</h3><ul class="clean imp">${(improves.length?improves:['لا توجد مجالات حرجة. واصل تعزيز ممارساتك الحالية.']).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="card mt"><h3>💡 ثلاث توصيات مخصصة لك</h3><ol class="recs">${recs.map(r=>`<li>${r}</li>`).join('')}</ol></div>
    <div class="card mt"><h3>🏅 الأوسمة</h3>${badgesHTML()}</div>
    <div class="mt" style="text-align:center"><button class="btn" data-act="restart">↺ إعادة التجربة من البداية</button></div>
  </section>`;
}

function render(){
  const v=S.view;
  app.innerHTML=v==='welcome'?vWelcome():v==='dash'?vDash():v==='play'?vPlay():vResults();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- الأحداث ---------- */
function fullReset(){S=fresh();save();render()}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, i=Number(el.dataset.i);
  if(a==='start'){
    // متابعة المسار الصحيح عند وجود تقدم محفوظ
    if(S.view==='welcome'){S.view=S.hist.some((h,k)=>h.length&&!S.done[k])?'play':(doneCount()===3?'results':'dash')}
  }else if(a==='open'){
    S.si=i;S.node=SC[i].start;S.hist[i]=[];S.pending=false;S.view='play';
  }else if(a==='choose'){
    if(S.pending)return;
    S.hist[S.si].push({n:S.node,o:i});S.pending=true;
    if(!SC[S.si].nodes[S.node].opts[i].n)S.done[S.si]=true;
  }else if(a==='next'){
    const h=S.hist[S.si][S.hist[S.si].length-1], nx=SC[S.si].nodes[h.n].opts[h.o].n;
    S.pending=false;
    if(nx){S.node=nx}else{S.view=doneCount()===3?'results':'dash'}
  }else if(a==='results'){S.view='results'}
  else if(a==='restart'){S=fresh();S.view='dash'}
  save();render();
});
document.querySelector('[data-act="reset"]').addEventListener('click',()=>{
  if(confirm('سيتم مسح تقدمك ونقاطك والبدء من جديد. هل تريد المتابعة؟'))fullReset();
});

if(typeof module!=='undefined')module.exports={SC,LEVELS,levelOf,MAX_TOTAL};
else render();
</script>
